<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventario Publicado | AUTOTECH GT</title>
    <link rel="icon" type="image/png" href="/logo-autotech.png">
    <link rel="shortcut icon" type="image/png" href="/logo-autotech.png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --azul-oscuro: #0a2540;
            --azul-primario: #0066cc;
            --celeste-fondo: #f0f6fc;
        }
        body {
            background-color: var(--celeste-fondo);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .navbar-admin {
            background: linear-gradient(135deg, var(--azul-oscuro) 0%, var(--azul-primario) 100%);
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.25);
        }
        .logo-navbar {
            height: 40px;
            width: auto;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.92);
            padding: 2px 6px;
        }
        .card-panel {
            border: none;
            border-radius: 16px;
            overflow: hidden;
        }
        .img-thumb {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 10px;
            background: #e9ecef;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-admin sticky-top mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="/admin.html">
                <img src="/logo-autotech.png" alt="Logo AUTOTECH GT" class="logo-navbar me-2">
                <span>Inventario Publicado - AUTOTECH GT</span>
            </a>
            <div class="d-flex gap-2">
                <a href="/admin.html" class="btn btn-warning btn-sm fw-bold rounded-pill px-3">
                    <i class="fa-solid fa-plus me-1"></i> Nuevo Producto / Categorías
                </a>
                <a href="/pedidos.html" class="btn btn-info text-dark btn-sm fw-bold rounded-pill px-3">
                    <i class="fa-solid fa-clipboard-list me-1"></i> Pedidos
                </a>
                <a href="/index.html" class="btn btn-light btn-sm fw-bold rounded-pill px-3">
                    <i class="fa-solid fa-store me-1"></i> Ver Tienda
                </a>
            </div>
        </div>
    </nav>

    <div class="container pb-5">
        <div class="card card-panel shadow-sm">
            <div class="card-header bg-dark text-white fw-bold py-3 d-flex justify-content-between align-items-center">
                <span><i class="fa-solid fa-boxes-stacked me-2"></i>Inventario Publicado</span>
                <button class="btn btn-outline-light btn-sm rounded-pill px-3" onclick="cargarProductos()">
                    <i class="fa-solid fa-rotate-right me-1"></i> Actualizar
                </button>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Foto</th>
                                <th>Producto</th>
                                <th>Categoría / Subcategoría</th>
                                <th>Precio</th>
                                <th class="text-end">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="tabla-productos-admin">
                            <tr>
                                <td colspan="5" class="text-center py-4 text-muted">Cargando inventario...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let productosAdmin = [];

        document.addEventListener('DOMContentLoaded', () => {
            const usuario = JSON.parse(localStorage.getItem('usuario_abu') || 'null');
            if (!usuario || usuario.rol !== 'admin') {
                window.location.href = '/index.html';
                return;
            }
            cargarProductos();
        });

        async function cargarProductos() {
            try {
                const res = await fetch('/api/productos');
                const data = await res.json().catch(() => []);
                productosAdmin = Array.isArray(data) ? data : [];
                renderizarProductosAdmin();
            } catch (err) {
                console.error('Error cargando productos:', err);
                document.getElementById('tabla-productos-admin').innerHTML =
                    `<tr><td colspan="5" class="text-center py-4 text-danger">Error al cargar productos.</td></tr>`;
            }
        }

        function editarProducto(id) {
            window.location.href = `/admin.html?editar=${encodeURIComponent(id)}`;
        }

        async function eliminarProducto(id) {
            if (!confirm('¿Eliminar este producto?')) return;
            const res = await fetch(`/api/productos/${id}`, { method: 'DELETE' });
            if (res.ok) await cargarProductos();
        }

        function renderizarProductosAdmin() {
            const tbody = document.getElementById('tabla-productos-admin');
            if (!productosAdmin.length) {
                tbody.innerHTML = `<tr><td colspan="5" class="text-center py-4 text-muted">Aún no hay productos publicados.</td></tr>`;
                return;
            }

            tbody.innerHTML = productosAdmin.map(p => `
                <tr>
                    <td>
                        <img src="${p.imagen_url || 'https://via.placeholder.com/60x60?text=Img'}" class="img-thumb" alt="${p.nombre}">
                    </td>
                    <td class="fw-bold">${p.nombre}</td>
                    <td>
                        <span class="badge bg-primary">${p.categorias?.nombre || 'General'}</span>
                        ${p.subcategorias?.nombre ? `<br><span class="badge bg-info text-dark mt-1">${p.subcategorias.nombre}</span>` : ''}
                    </td>
                    <td class="fw-bold text-primary">Q${parseFloat(p.precio).toFixed(2)}</td>
                    <td class="text-end text-nowrap">
                        <button class="btn btn-warning btn-sm me-1" title="Editar" onclick="editarProducto(${p.id})">
                            <i class="fa-solid fa-pen"></i>
                        </button>
                        <button class="btn btn-danger btn-sm" title="Eliminar" onclick="eliminarProducto(${p.id})">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }
    </script>
</body>
</html>
